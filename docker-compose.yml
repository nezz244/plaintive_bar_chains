services:
  mysql:
    image: mysql:8.0
    container_name: venuepos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-venuepos}
      MYSQL_DATABASE: venuepos
    ports:
      - "3306:3306"
    volumes:
      - venuepos_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  venuepos_mysql_data:
